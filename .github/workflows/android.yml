name: Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot 4.4 and export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable" /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.stable/"
      - name: Configure Android export tools and debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          godot --headless --editor --path . --quit
          python3 - <<'PY'
          from pathlib import Path
          import os
          candidates=sorted((Path.home()/'.config/godot').glob('editor_settings-*.tres'))
          if not candidates:
              raise SystemExit('Godot editor settings not found in ~/.config/godot')
          p=candidates[-1]
          s=p.read_text()
          settings={
              'export/android/android_sdk_path':os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path':os.environ['JAVA_HOME'],
              'export/android/debug_keystore':str(Path.home()/'.android/debug.keystore'),
              'export/android/debug_keystore_user':'androiddebugkey',
              'export/android/debug_keystore_pass':'android',
          }
          import re
          for k,v in settings.items():
              line=f'{k} = "{v}"'
              pattern=r'(?m)^'+re.escape(k)+r'\s*=.*$'
              s=re.sub(pattern,lambda m:line,s) if re.search(pattern,s) else s.rstrip()+'\n'+line+'\n'
          p.write_text(s)
          PY
      - name: Validate Android tooling
        run: |
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          test -f "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$JAVA_HOME/bin/java"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.stable/" | head
      - name: Validate project
        run: |
          mkdir -p build
          python3 - <<'PY'
          import configparser
          from pathlib import Path

          project = configparser.ConfigParser(interpolation=None)
          project.read_string('[godot]\n' + Path('project.godot').read_text(encoding='utf-8'))
          if not project.getboolean('rendering', 'textures/vram_compression/import_etc2_astc', fallback=False):
              raise SystemExit('::error::Android requires textures/vram_compression/import_etc2_astc=true in [rendering] in project.godot.')
          print('Android ETC2/ASTC texture import: enabled')
          PY
          godot --headless --verbose --path . --editor --quit 2>&1 | tee build/import.log
          godot --headless --path . --script res://scripts/game.gd --check-only 2>&1 | tee build/scripts.log
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/AntColony3D.apk 2>&1 | tee build/android-export.log
          test -s build/AntColony3D.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/AntColony3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AntColony3D-debug-apk
          path: build/AntColony3D.apk
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AntColony3D-build-logs
          path: build/*.log
          if-no-files-found: ignore
